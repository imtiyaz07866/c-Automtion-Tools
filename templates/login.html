<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — YouTube to Facebook AutoPoster</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #0b0d14; --card: #13152a; --border: #222545;
            --text: #e4e6f0; --muted: #6b6f8a;
            --accent: #7c5cfc; --accent2: #e040fb;
            --green: #34d399; --red: #f87171;
        }
        html, body { height: 100%; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }

        /* Animated gradient background */
        body::before {
            content: '';
            position: fixed; inset: 0;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(124,92,252,0.12) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(224,64,251,0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 60% 80%, rgba(52,211,153,0.06) 0%, transparent 50%);
            z-index: 0;
            animation: bgShift 12s ease-in-out infinite alternate;
        }
        @keyframes bgShift {
            0% { opacity: 0.8; }
            100% { opacity: 1; transform: scale(1.05); }
        }

        .login-container {
            position: relative; z-index: 1;
            width: 100%; max-width: 440px;
            padding: 20px;
        }

        .login-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 44px 36px 36px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 80px rgba(124,92,252,0.08);
            backdrop-filter: blur(10px);
        }

        .brand {
            text-align: center;
            margin-bottom: 32px;
        }
        .brand-logo {
            width: 60px; height: 60px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            border-radius: 16px;
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 1.8rem;
            box-shadow: 0 8px 30px rgba(124,92,252,0.35);
            margin-bottom: 16px;
        }
        .brand h1 {
            font-size: 1.5rem; font-weight: 700;
            letter-spacing: -0.5px;
        }
        .brand p { color: var(--muted); font-size: 0.88rem; margin-top: 6px; }

        /* Tab switcher */
        .auth-tabs {
            display: flex; gap: 4px;
            background: rgba(255,255,255,0.04);
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 28px;
        }
        .auth-tab {
            flex: 1; text-align: center;
            padding: 10px; border-radius: 8px;
            font-weight: 600; font-size: 0.9rem;
            cursor: pointer; color: var(--muted);
            transition: all 0.25s ease;
            border: none; background: none;
            font-family: inherit;
        }
        .auth-tab.active {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: #fff;
            box-shadow: 0 4px 15px rgba(124,92,252,0.3);
        }

        /* Forms */
        .auth-form { display: none; }
        .auth-form.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        .field { margin-bottom: 18px; }
        .field label {
            display: block; font-size: 0.78rem; font-weight: 600;
            color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px;
            margin-bottom: 6px;
        }
        .field input {
            width: 100%; padding: 13px 16px;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text); font-size: 0.95rem;
            font-family: inherit;
            outline: none;
            transition: all 0.25s ease;
        }
        .field input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(124,92,252,0.2);
        }
        .field input::placeholder { color: #444668; }

        .submit-btn {
            width: 100%; padding: 14px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            border: none; border-radius: 10px;
            color: #fff; font-size: 1rem; font-weight: 700;
            cursor: pointer; font-family: inherit;
            box-shadow: 0 6px 25px rgba(124,92,252,0.35);
            transition: all 0.25s ease;
            margin-top: 8px;
        }
        .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 35px rgba(124,92,252,0.5); }
        .submit-btn:active { transform: scale(0.97); }
        .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .msg {
            padding: 10px 14px; border-radius: 8px;
            font-size: 0.85rem; font-weight: 500;
            margin-bottom: 16px; display: none;
        }
        .msg.show { display: block; animation: fadeIn 0.3s ease; }
        .msg.error { background: rgba(248,113,113,0.12); color: var(--red); border: 1px solid rgba(248,113,113,0.2); }
        .msg.success { background: rgba(52,211,153,0.12); color: var(--green); border: 1px solid rgba(52,211,153,0.2); }

        .footer-text {
            text-align: center; margin-top: 20px;
            font-size: 0.78rem; color: var(--muted);
        }

        /* Floating particles */
        .particles { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
        .particle {
            position: absolute;
            width: 4px; height: 4px;
            background: var(--accent);
            border-radius: 50%;
            opacity: 0.2;
            animation: float linear infinite;
        }
        @keyframes float {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 0.3; }
            90% { opacity: 0.1; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }
    </style>
</head>
<body>

<!-- Floating Particles -->
<div class="particles" id="particles"></div>

<div class="login-container">
    <div class="login-card">
        <div class="brand">
            <div class="brand-logo">▶</div>
            <h1>AutoPoster</h1>
            <p>YouTube → Facebook Cloud Automation</p>
        </div>

        <!-- Tab Switcher -->
        <div class="auth-tabs">
            <button class="auth-tab active" onclick="switchTab('login')">Login</button>
            <button class="auth-tab" onclick="switchTab('register')">Register</button>
        </div>

        <!-- Message Box -->
        <div class="msg" id="msgBox"></div>

        <!-- Login Form -->
        <form class="auth-form active" id="loginForm" onsubmit="handleLogin(event)">
            <div class="field">
                <label>Username</label>
                <input type="text" id="loginUser" placeholder="Apna username daalein" required autocomplete="username">
            </div>
            <div class="field">
                <label>Password</label>
                <input type="password" id="loginPass" placeholder="Apna password daalein" required autocomplete="current-password">
            </div>
            <button type="submit" class="submit-btn" id="loginBtn">🔐 Login</button>
        </form>

        <!-- Register Form -->
        <form class="auth-form" id="registerForm" onsubmit="handleRegister(event)">
            <div class="field">
                <label>Display Name</label>
                <input type="text" id="regName" placeholder="Aapka naam" autocomplete="name">
            </div>
            <div class="field">
                <label>Username</label>
                <input type="text" id="regUser" placeholder="Username choose karein (3+ characters)" required autocomplete="username">
            </div>
            <div class="field">
                <label>Password</label>
                <input type="password" id="regPass" placeholder="Password set karein (4+ characters)" required autocomplete="new-password">
            </div>
            <button type="submit" class="submit-btn" id="regBtn">🚀 Register</button>
        </form>

        <div class="footer-text">24/7 Cloud Powered Auto-Posting</div>
    </div>
</div>

<script>
// Tab switch
function switchTab(tab) {
    document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
    if (tab === 'login') {
        document.querySelectorAll('.auth-tab')[0].classList.add('active');
        document.getElementById('loginForm').classList.add('active');
    } else {
        document.querySelectorAll('.auth-tab')[1].classList.add('active');
        document.getElementById('registerForm').classList.add('active');
    }
    hideMsg();
}

// Messages
function showMsg(text, type) {
    const m = document.getElementById('msgBox');
    m.textContent = text;
    m.className = 'msg show ' + type;
}
function hideMsg() { document.getElementById('msgBox').className = 'msg'; }

// Login
async function handleLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    btn.disabled = true; btn.textContent = '⏳ Loading...';
    try {
        const res = await fetch('/api/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                username: document.getElementById('loginUser').value,
                password: document.getElementById('loginPass').value
            })
        });
        const data = await res.json();
        if (data.success) {
            showMsg('Login successful! Redirecting...', 'success');
            setTimeout(() => window.location.href = '/', 800);
        } else {
            showMsg(data.message, 'error');
            btn.disabled = false; btn.textContent = '🔐 Login';
        }
    } catch(err) {
        showMsg('Connection error!', 'error');
        btn.disabled = false; btn.textContent = '🔐 Login';
    }
}

// Register
async function handleRegister(e) {
    e.preventDefault();
    const btn = document.getElementById('regBtn');
    btn.disabled = true; btn.textContent = '⏳ Creating...';
    try {
        const res = await fetch('/api/register', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                username: document.getElementById('regUser').value,
                password: document.getElementById('regPass').value,
                display_name: document.getElementById('regName').value
            })
        });
        const data = await res.json();
        if (data.success) {
            showMsg(data.message, 'success');
            setTimeout(() => switchTab('login'), 1500);
        } else {
            showMsg(data.message, 'error');
        }
        btn.disabled = false; btn.textContent = '🚀 Register';
    } catch(err) {
        showMsg('Connection error!', 'error');
        btn.disabled = false; btn.textContent = '🚀 Register';
    }
}

// Floating particles
(function() {
    const container = document.getElementById('particles');
    for (let i = 0; i < 30; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = Math.random() * 100 + '%';
        p.style.animationDuration = (8 + Math.random() * 15) + 's';
        p.style.animationDelay = Math.random() * 10 + 's';
        p.style.width = p.style.height = (2 + Math.random() * 4) + 'px';
        container.appendChild(p);
    }
})();
</script>
</body>
</html>
