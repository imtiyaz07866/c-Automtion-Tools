<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛡️ Admin Control Portal | AutoPoster SaaS</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { background: #0c0d16; color: #f3f4f6; font-family: 'Inter', sans-serif; min-height: 100vh; padding: 30px 20px; }
        .admin-container { max-width: 1100px; margin: 0 auto; }
        .admin-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 30px; background: rgba(18, 20, 36, 0.8); padding: 20px 25px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.08); }
        .admin-title { font-size: 1.5rem; font-weight: 800; color: #fff; display: flex; align-items: center; gap: 10px; }
        .admin-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: rgba(18, 20, 36, 0.8); border: 1px solid rgba(255,255,255,0.08); padding: 20px; border-radius: 12px; }
        .stat-val { font-size: 1.8rem; font-weight: 800; color: var(--accent, #6366f1); margin-top: 6px; }
        .table-wrap { overflow-x: auto; background: rgba(18, 20, 36, 0.8); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 20px; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 14px 16px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        th { font-size: 0.8rem; font-weight: 700; color: #9ca3af; text-transform: uppercase; }
        .badge-admin { background: rgba(99, 102, 241, 0.2); color: #818cf8; border: 1px solid rgba(99, 102, 241, 0.4); padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; }
        .badge-approved { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.4); padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; }
        .badge-pending { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.4); padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; }
    </style>
</head>
<body>
    <div class="admin-container">
        <!-- Header -->
        <div class="admin-header">
            <div>
                <div class="admin-title">🛡️ Admin Management Portal</div>
                <p style="color:#9ca3af; font-size:0.88rem; margin-top:4px;">Private Access Control Managed by <strong style="color:var(--accent);">Imtiyaz Alam</strong></p>
            </div>
            <a href="/" class="btn" style="background: rgba(255,255,255,0.1); color:#fff; text-decoration:none; padding:10px 18px; border-radius:8px; font-weight:600; font-size:0.9rem;">
                ← Back to Dashboard
            </a>
        </div>

        <!-- Stats Strip -->
        <div class="admin-stats">
            <div class="stat-card">
                <span style="color:#9ca3af; font-size:0.85rem; font-weight:600;">Total Registered Users</span>
                <div class="stat-val" id="statTotalUsers">0</div>
            </div>
            <div class="stat-card">
                <span style="color:#9ca3af; font-size:0.85rem; font-weight:600;">Pending Approvals</span>
                <div class="stat-val" id="statPendingUsers" style="color: #fbbf24;">0</div>
            </div>
            <div class="stat-card">
                <span style="color:#9ca3af; font-size:0.85rem; font-weight:600;">System Access Mode</span>
                <div class="stat-val" id="statAccessMode" style="font-size:1.1rem; margin-top:12px; color:#34d399;">🔒 PRIVATE</div>
            </div>
        </div>

        <!-- User Access Control Card -->
        <div class="table-wrap">
            <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; flex-wrap:wrap; gap:10px;">
                <h3>👥 Registered User Accounts & Approval Control</h3>
                <button class="btn btn-primary" onclick="loadAdminData()" style="padding:8px 16px; font-size:0.85rem;">🔄 Refresh List</button>
            </div>
            <div id="usersList">
                <p style="color:#9ca3af; text-align:center;">Loading users...</p>
            </div>
        </div>
    </div>

    <script>
        async function loadAdminData() {
            try {
                const res = await fetch('/api/admin/users');
                const users = await res.json();
                
                document.getElementById('statTotalUsers').textContent = users.length;
                const pending = users.filter(u => !u.is_approved && !u.is_admin).length;
                document.getElementById('statPendingUsers').textContent = pending;

                const el = document.getElementById('usersList');
                if (!users || users.length === 0) {
                    el.innerHTML = '<p style="color:#9ca3af; text-align:center;">No users registered yet.</p>';
                    return;
                }

                let html = `<table><thead><tr>
                    <th>ID</th><th>User Name</th><th>Email</th><th>Role / Status</th><th>Action</th>
                </tr></thead><tbody>`;

                users.forEach(u => {
                    const statusBadge = u.is_admin
                        ? '<span class="badge-admin">SUPER ADMIN (Owner)</span>'
                        : u.is_approved
                        ? '<span class="badge-approved">APPROVED</span>'
                        : '<span class="badge-pending">PENDING APPROVAL</span>';

                    let actionBtn = '';
                    if (u.is_admin) {
                        actionBtn = '<span style="color:#6b7280; font-size:0.82rem; font-weight:700;">Owner Account</span>';
                    } else if (u.is_approved) {
                        actionBtn = `<button onclick="rejectUser(${u.id})" style="background:rgba(239,68,68,0.2); color:#f87171; border:1px solid rgba(239,68,68,0.4); padding:6px 12px; border-radius:6px; font-weight:600; cursor:pointer;">🛑 Reject / Block</button>`;
                    } else {
                        actionBtn = `<button onclick="approveUser(${u.id})" style="background:rgba(16,185,129,0.2); color:#34d399; border:1px solid rgba(16,185,129,0.4); padding:6px 12px; border-radius:6px; font-weight:600; cursor:pointer;">✅ APPROVE ACCESS</button>`;
                    }

                    html += `<tr>
                        <td>#${u.id}</td>
                        <td><strong>${u.display_name || u.username}</strong><br><small style="color:#9ca3af;">@${u.username}</small></td>
                        <td>${u.email || '-'}</td>
                        <td>${statusBadge}</td>
                        <td>${actionBtn}</td>
                    </tr>`;
                });

                html += '</tbody></table>';
                el.innerHTML = html;
            } catch(e) {
                console.error(e);
            }
        }

        async function approveUser(uid) {
            if (!confirm('Approve this user for cloud access?')) return;
            const res = await fetch('/api/admin/approve-user', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: uid })
            });
            loadAdminData();
        }

        async function rejectUser(uid) {
            if (!confirm('Block / Delete this user account?')) return;
            const res = await fetch('/api/admin/reject-user', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: uid })
            });
            loadAdminData();
        }

        loadAdminData();
    </script>
</body>
</html>
